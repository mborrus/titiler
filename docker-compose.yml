services:
  titiler:
    # Keep a single-worker uvicorn app around for quick tests/dev, but not for heavy VRTs.
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    ports:
      - "8000:8000"
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      # ---- GDAL / VSI / HTTP tuning ----
      - CPL_TMPDIR=/tmp
      - GDAL_CACHEMAX=75%
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.vrt,.ovr,.msk,.json
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_MULTIRANGE=YES
      - GDAL_HTTP_VERSION=2
      - CPL_VSIL_CURL_CHUNK_SIZE=1048576
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      # Helpful when bucket uses requester pays (safe to leave set if not)
      - AWS_REQUEST_PAYER=requester
      # Increase S3 connection pooling for high fan-out VRTs
      - AWS_MAX_POOL_CONNECTIONS=256
      - PYTHONWARNINGS=ignore

      # ---- rio-tiler / Titiler ----
      - RIO_TILER_MAX_THREADS=20
      - TITILER_API_TELEMETRY_ENABLED=True
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # If you rely on mosaic endpoints, leave them enabled (default)
      # - TITILER_API_DISABLE_MOSAIC=FALSE

      # ---- (Optional) Caching headers if you sit behind CDN ----
      # - TITILER_API_CACHECONTROL=public, max-age=3600

      # ---- AWS creds (passed through) ----
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      - otel-collector
    volumes:
      - ./:/data

  titiler-gunicorn:
    extends:
      service: titiler
    # Expose only via nginx; gunicorn binds internal port 8000
    ports:
      - "8000:8000"
    # Multiple workers and threads help avoid single-worker choke on large VRTs
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "titiler.application.main:app",
              "--bind", "0.0.0.0:8000",
              "--workers", "4",            # scale up for CPU/network
              "--threads", "2",            # some I/O parallelism per worker
              "--timeout", "120"]          # large tiles/first access breathing room

  benchmark:
    extends:
      service: titiler
    environment:
      - CPL_TMPDIR=/tmp
      - GDAL_CACHEMAX=75%
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - PYTHONWARNINGS=ignore
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - TITILER_API_TELEMETRY_ENABLED=False
    volumes:
      - ./.github/data:/data

  nginx-titiler:
    extends:
      service: titiler
    # Run uvicorn variant on 8081 (kept for compatibility with your nginx.conf)
    command: ["uvicorn", "titiler.application.main:app",
              "--host", "0.0.0.0", "--port", "8081",
              "--workers", "1", "--proxy-headers",
              "--forwarded-allow-ips=*", "--root-path=/api/v1/titiler"]

  nginx:
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ./dockerfiles/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - nginx-titiler
    command: ["nginx-debug", "-g", "daemon off;"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./dockerfiles/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"   # OTLP HTTP receiver
      - "13133:13133" # Health check extension
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "14250:14250" # OTLP gRPC (Jaeger receiver)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

